services:
  - type: web
    name: flavour-pos-app
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /status.php
    envVars:
      - key: AUTO_MIGRATE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: flavour-pos-db
          property: connectionString

databases:
  - name: flavour-pos-db
    databaseName: food_app
    user: postgres
    plan: free
